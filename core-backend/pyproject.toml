[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unum-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "jsonschema>=4.23,<5",
  "GitPython>=3.1,<4",
  "httpx>=0.27,<1",
  "cryptography>=43,<47",
  "zstandard>=0.23,<1",
  "asyncpg>=0.30,<1",
  "asyncmy>=0.2,<1",
  "pymongo>=4.11,<5",
  "redis>=5.2,<7",
  "cassandra-driver>=3.29,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
